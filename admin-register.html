<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | CampusConnect</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
        }

        .admin-login-card {
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background: #1e3a8a;
        }

        .password-input-group {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .password-input-group input {
            width: 100%;
            padding-right: 46px !important;
        }

        .toggle-password-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            padding: 6px;
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            border-radius: 6px;
            z-index: 5;
        }

        .toggle-password-btn:hover {
            color: #1e3a8a;
            background: #f1f5f9;
        }

        .toggle-password-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            display: block;
            pointer-events: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1e40af;
            text-decoration: none;
        }

        #registerMessage {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="admin-login-wrapper">
        <div class="admin-login-card">
            <h1>Admin Registration</h1>
            <p class="subtitle">Create a CampusConnect admin account</p>

            <form id="adminRegisterForm">
                <label for="adminName">Full Name</label>
                <input
                    type="text"
                    id="adminName"
                    placeholder="Enter full name"
                    required
                >

                <label for="newAdminEmail">Admin Email</label>
                <input
                    type="email"
                    id="newAdminEmail"
                    placeholder="Enter email"
                    required
                >

                <label for="adminSecretKey">Admin Secret Key</label>
                <div class="password-input-group">
                    <input
                        type="password"
                        id="adminSecretKey"
                        name="admin_secret_passcode"
                        autocomplete="off"
                        data-lpignore="true"
                        placeholder="Enter authorized admin secret key"
                        required
                    >
                    <button type="button" class="toggle-password-btn" title="Show/Hide Secret Key" aria-label="Toggle secret key visibility">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>

                <label for="newAdminPassword">Password</label>
                <div class="password-input-group">
                    <input
                        type="password"
                        id="newAdminPassword"
                        name="new_admin_password"
                        autocomplete="new-password"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >
                    <button type="button" class="toggle-password-btn" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>

                <button type="submit">Register Admin</button>

                <p id="registerMessage" aria-live="polite"></p>
            </form>

            <a href="admin-login.html" class="back-home">
                Already registered? Login
            </a>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>

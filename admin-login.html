<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CampusConnect</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
        }

        .admin-login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .admin-login-card h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .admin-login-card .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .admin-login-card label {
            display: block;
            margin: 15px 0 7px;
            font-weight: 600;
        }

        .admin-login-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .admin-login-card button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .admin-login-card button:hover {
            background: #1e3a8a;
        }

        #adminLoginMessage {
            margin-top: 15px;
            text-align: center;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1e40af;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="admin-login-wrapper">
        <div class="admin-login-card">

            <h1>Admin Login</h1>
            <p class="subtitle">CampusConnect Event Management</p>

            <form id="adminLoginForm">

                <label for="adminEmail">Admin Email</label>
                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                >

                <label for="adminPassword">Password</label>
                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter admin password"
                    required
                >

                <button type="submit">Login as Admin</button>

                <p id="adminLoginMessage"></p>

            </form>
            <a href="admin-register.html" class="back-home">
            Register New Admin
            </a>
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>
    </div>

    <script src="js/admin.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CampusConnect</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-login-wrapper {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
        }

        .admin-login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .admin-login-card h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .admin-login-card .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .admin-login-card label {
            display: block;
            margin: 15px 0 7px;
            font-weight: 600;
        }

        .admin-login-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .admin-login-card button[type="submit"] {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .admin-login-card button[type="submit"]:hover {
            background: #1e3a8a;
        }

        .password-input-group {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .password-input-group input {
            width: 100%;
            padding-right: 46px !important;
        }

        .toggle-password-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            padding: 6px;
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            border-radius: 6px;
            z-index: 5;
        }

        .toggle-password-btn:hover {
            color: #1e3a8a;
            background: #f1f5f9;
        }

        .toggle-password-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            display: block;
            pointer-events: none;
        }

        #adminLoginMessage {
            margin-top: 15px;
            text-align: center;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1e40af;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo" style="color: #ffffff !important; text-decoration: none !important; font-size: 24px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;">
            <span class="logo-icon" style="font-size: 24px;">🎓</span>
            <span class="brand-campus" style="color: #ffffff !important;">Campus</span><span class="brand-connect" style="color: #38bdf8 !important;">Connect</span>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Student Login</a>
        </nav>
    </header>

    <div class="admin-login-wrapper">
        <div class="admin-login-card">

            <h1>Admin Login</h1>
            <p class="subtitle">CampusConnect Event Management</p>

            <form id="adminLoginForm">

                <label for="adminEmail">Admin Email</label>
                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                >

                <label for="adminPassword">Password</label>
                <div class="password-input-group">
                    <input
                        type="password"
                        id="adminPassword"
                        name="admin_current_password"
                        autocomplete="current-password"
                        placeholder="Enter admin password"
                        required
                    >
                    <button type="button" class="toggle-password-btn" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>

                <div style="text-align: right; margin-top: 8px;">
                    <a href="forgot-password.html?role=admin" style="color: #1e40af; font-size: 13px; text-decoration: none; font-weight: 500;">Forgot Password?</a>
                </div>

                <button type="submit">Login as Admin</button>

                <p id="adminLoginMessage"></p>

            </form>
            <a href="admin-register.html" class="back-home">
            Register New Admin
            </a>
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>
    </div>

    <script src="js/admin.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CampusConnect</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .forgot-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
        }

        .forgot-card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            box-sizing: border-box;
        }

        .forgot-card h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 6px;
            font-size: 26px;
        }

        .forgot-card .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 22px;
            font-size: 14px;
        }

        /* Tabs */
        .tab-group {
            display: flex;
            background: #f1f5f9;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 22px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent !important;
            color: #64748b !important;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            width: auto !important;
            margin: 0 !important;
        }

        .tab-btn.active {
            background: #1e40af !important;
            color: white !important;
            box-shadow: 0 2px 6px rgba(30, 64, 175, 0.25);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #1e40af;
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            background: #1e3a8a;
        }

        .password-input-group {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .password-input-group input {
            width: 100%;
            padding-right: 46px !important;
        }

        .toggle-password-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            padding: 6px;
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            border-radius: 6px;
            z-index: 5;
        }

        .toggle-password-btn:hover {
            color: #1e3a8a;
            background: #f1f5f9;
        }

        .toggle-password-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            display: block;
            pointer-events: none;
        }

        .feedback-message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
        }

        .back-links {
            margin-top: 22px;
            text-align: center;
            display: flex;
            justify-content: space-around;
            font-size: 14px;
        }

        .back-links a {
            color: #1e40af;
            text-decoration: none;
            font-weight: 500;
        }

        .back-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo" style="color: #ffffff !important; text-decoration: none !important; font-size: 24px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;">
            <span class="logo-icon" style="font-size: 24px;">🎓</span>
            <span class="brand-campus" style="color: #ffffff !important;">Campus</span><span class="brand-connect" style="color: #38bdf8 !important;">Connect</span>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Student Login</a>
            <a href="admin-login.html">Admin Login</a>
        </nav>
    </header>

    <div class="forgot-wrapper" style="min-height: calc(100vh - 70px);">
        <div class="forgot-card">
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your details to create a new password</p>

            <div class="tab-group">
                <button type="button" class="tab-btn active" id="studentTabBtn" onclick="switchTab('student')">
                    🎓 Student
                </button>
                <button type="button" class="tab-btn" id="adminTabBtn" onclick="switchTab('admin')">
                    🛡️ Admin
                </button>
            </div>

            <!-- STUDENT RESET FORM -->
            <div id="studentTab" class="tab-content active">
                <form id="studentForgotForm">
                    <label for="studentEmail">Student Email or Enrollment Number</label>
                    <input type="text" id="studentEmail" placeholder="Enter your email or enrollment number (e.g. 0808CL241154)" required>

                    <label for="studentId" style="font-size: 13px; color: #64748b; font-weight: normal; margin-top: 10px;">Enrollment Number (Optional if entered above)</label>
                    <input type="text" id="studentId" placeholder="Optional if entered above">

                    <label for="studentNewPassword">New Password</label>
                    <div class="password-input-group">
                        <input type="password" id="studentNewPassword" placeholder="Minimum 6 characters" minlength="6" required>
                        <button type="button" class="toggle-password-btn" title="Show/Hide Password" aria-label="Toggle password visibility">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>

                    <button type="submit">Reset Student Password</button>
                    <p id="studentForgotMessage" class="feedback-message"></p>
                </form>
            </div>

            <!-- ADMIN RESET FORM -->
            <div id="adminTab" class="tab-content">
                <form id="adminForgotForm">
                    <label for="adminEmail">Admin Email or Username</label>
                    <input type="text" id="adminEmail" placeholder="Enter admin email or username (e.g. admin)" required>

                    <label for="adminSecretKey">Admin Secret Key</label>
                    <div class="password-input-group">
                        <input type="password" id="adminSecretKey" placeholder="Enter organization secret key" required>
                        <button type="button" class="toggle-password-btn" title="Show/Hide Secret Key" aria-label="Toggle secret key visibility">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>

                    <label for="adminNewPassword">New Password</label>
                    <div class="password-input-group">
                        <input type="password" id="adminNewPassword" placeholder="Minimum 6 characters" minlength="6" required>
                        <button type="button" class="toggle-password-btn" title="Show/Hide Password" aria-label="Toggle password visibility">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>

                    <button type="submit">Reset Admin Password</button>
                    <p id="adminForgotMessage" class="feedback-message"></p>
                </form>
            </div>

            <div class="back-links">
                <a href="login.html">← Student Login</a>
                <a href="admin-login.html">Admin Login →</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin.includes('5000') 
            ? '/api' 
            : 'http://127.0.0.1:5000/api';

        function switchTab(role) {
            const studentBtn = document.getElementById('studentTabBtn');
            const adminBtn = document.getElementById('adminTabBtn');
            const studentTab = document.getElementById('studentTab');
            const adminTab = document.getElementById('adminTab');

            if (role === 'admin') {
                adminBtn.classList.add('active');
                studentBtn.classList.remove('active');
                adminTab.classList.add('active');
                studentTab.classList.remove('active');
            } else {
                studentBtn.classList.add('active');
                adminBtn.classList.remove('active');
                studentTab.classList.add('active');
                adminTab.classList.remove('active');
            }
        }

        // Auto select tab from URL parameter (?role=admin or ?role=student)
        document.addEventListener('DOMContentLoaded', function () {
            const params = new URLSearchParams(window.location.search);
            if (params.get('role') === 'admin') {
                switchTab('admin');
            }

            // Student Reset Submission
            const studentForm = document.getElementById('studentForgotForm');
            if (studentForm) {
                studentForm.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    const emailInput = document.getElementById('studentEmail').value.trim();
                    const studentIdInput = (document.getElementById('studentId') ? document.getElementById('studentId').value.trim() : '');
                    const newPassword = document.getElementById('studentNewPassword').value;
                    const message = document.getElementById('studentForgotMessage');

                    const identifier = emailInput || studentIdInput;
                    if (!identifier) {
                        message.style.color = '#dc2626';
                        message.textContent = 'Please enter your student email or enrollment number.';
                        return;
                    }

                    if (newPassword.length < 6) {
                        message.style.color = '#dc2626';
                        message.textContent = 'Password must be at least 6 characters.';
                        return;
                    }

                    message.style.color = '#1e40af';
                    message.textContent = 'Verifying and updating password...';

                    try {
                        const res = await fetch(`${API_BASE}/forgot-password`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                identifier: identifier,
                                email: emailInput.toLowerCase(), 
                                student_id: studentIdInput || emailInput, 
                                new_password: newPassword 
                            })
                        });
                        const data = await res.json();
                        if (res.ok && data.success) {
                            // Sync with LocalStorage
                            try {
                                const students = JSON.parse(localStorage.getItem('campusConnectStudents') || '[]');
                                const targetId = (studentIdInput || emailInput).toLowerCase();
                                const targetEmail = emailInput.toLowerCase();
                                const idx = students.findIndex(s => 
                                    (s.email && s.email.toLowerCase() === targetEmail) || 
                                    (s.studentId && s.studentId.toLowerCase() === targetId)
                                );
                                if (idx !== -1) {
                                    students[idx].password = newPassword;
                                    localStorage.setItem('campusConnectStudents', JSON.stringify(students));
                                } else if (data.student) {
                                    students.push({
                                        name: data.student.name || 'Student',
                                        email: data.student.email,
                                        studentId: data.student.studentId,
                                        password: newPassword,
                                        department: data.student.department || '',
                                        year: data.student.year || ''
                                    });
                                    localStorage.setItem('campusConnectStudents', JSON.stringify(students));
                                }
                            } catch (lsErr) {}

                            message.style.color = '#16a34a';
                            message.textContent = data.message || 'Password reset successfully! Redirecting to login...';
                            setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                        } else {
                            message.style.color = '#dc2626';
                            message.textContent = data.message || 'Reset failed. Check details.';
                        }
                    } catch (err) {
                        console.error('Reset error:', err);
                        // Local fallback only if user exists in local storage
                        try {
                            const students = JSON.parse(localStorage.getItem('campusConnectStudents') || '[]');
                            const targetId = (studentIdInput || emailInput).toLowerCase();
                            const targetEmail = emailInput.toLowerCase();
                            const idx = students.findIndex(s => 
                                (s.email && s.email.toLowerCase() === targetEmail) || 
                                (s.studentId && s.studentId.toLowerCase() === targetId)
                            );
                            if (idx !== -1) {
                                students[idx].password = newPassword;
                                localStorage.setItem('campusConnectStudents', JSON.stringify(students));
                                message.style.color = '#16a34a';
                                message.textContent = 'Password reset locally! Redirecting to login...';
                                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                                return;
                            }
                        } catch (e) {}

                        message.style.color = '#dc2626';
                        message.textContent = 'Reset failed. Make sure the backend server is running and check your details.';
                    }
                });
            }

            // Admin Reset Submission
            const adminForm = document.getElementById('adminForgotForm');
            if (adminForm) {
                adminForm.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    const email = document.getElementById('adminEmail').value.trim().toLowerCase();
                    const secretKey = document.getElementById('adminSecretKey').value.trim();
                    const newPassword = document.getElementById('adminNewPassword').value;
                    const message = document.getElementById('adminForgotMessage');

                    if (!email || !secretKey || !newPassword) {
                        message.style.color = '#dc2626';
                        message.textContent = 'Please fill in all fields.';
                        return;
                    }

                    if (newPassword.length < 6) {
                        message.style.color = '#dc2626';
                        message.textContent = 'Password must be at least 6 characters.';
                        return;
                    }

                    message.style.color = '#1e40af';
                    message.textContent = 'Verifying and updating password...';

                    try {
                        const res = await fetch(`${API_BASE}/admin/forgot-password`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, username: email, secret_key: secretKey, new_password: newPassword })
                        });
                        const data = await res.json();
                        if (res.ok && data.success) {
                            try {
                                const admins = JSON.parse(localStorage.getItem('campusConnectAdmins') || '[]');
                                const idx = admins.findIndex(a => a.email && a.email.toLowerCase() === email);
                                if (idx !== -1) {
                                    admins[idx].password = newPassword;
                                    localStorage.setItem('campusConnectAdmins', JSON.stringify(admins));
                                }
                            } catch (e) {}

                            message.style.color = '#16a34a';
                            message.textContent = data.message || 'Admin password reset successfully! Redirecting...';
                            setTimeout(() => { window.location.href = 'admin-login.html'; }, 1500);
                        } else {
                            message.style.color = '#dc2626';
                            message.textContent = data.message || 'Reset failed. Check details.';
                        }
                    } catch (err) {
                        console.error('Admin reset error:', err);
                        if (secretKey === 'CAMPUS@2026') {
                            try {
                                const admins = JSON.parse(localStorage.getItem('campusConnectAdmins') || '[]');
                                const idx = admins.findIndex(a => a.email && a.email.toLowerCase() === email);
                                if (idx !== -1) {
                                    admins[idx].password = newPassword;
                                    localStorage.setItem('campusConnectAdmins', JSON.stringify(admins));
                                }
                                message.style.color = '#16a34a';
                                message.textContent = 'Password reset locally! Redirecting to login...';
                                setTimeout(() => { window.location.href = 'admin-login.html'; }, 1500);
                                return;
                            } catch (e) {}
                        }
                        message.style.color = '#dc2626';
                        message.textContent = 'Reset failed. Invalid Secret Key or backend server offline.';
                    }
                });
            }

            // Eye Icon Toggle Handler
            document.addEventListener('click', function (e) {
                const btn = e.target.closest('.toggle-password-btn');
                if (!btn) return;
                const group = btn.closest('.password-input-group');
                if (!group) return;
                const input = group.querySelector('input');
                if (!input) return;
                const eyeOpen = btn.querySelector('.eye-open');
                const eyeClosed = btn.querySelector('.eye-closed');

                if (input.type === 'password') {
                    input.type = 'text';
                    if (eyeOpen) eyeOpen.style.display = 'none';
                    if (eyeClosed) eyeClosed.style.display = 'block';
                    btn.setAttribute('title', 'Hide password');
                } else {
                    input.type = 'password';
                    if (eyeOpen) eyeOpen.style.display = 'block';
                    if (eyeClosed) eyeClosed.style.display = 'none';
                    btn.setAttribute('title', 'Show password');
                }
            });
        });
    </script>
</body>
</html>
